<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b1b1d">
<title>miPod</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:#1b1b1d;font-family:Helvetica,Arial,sans-serif;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#ipod{height:100%;max-height:640px;aspect-ratio:10/16;max-width:100%;background:linear-gradient(160deg,#f4f4f2,#cfd0d2);border-radius:5vmin;padding:6% 7%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;box-shadow:inset 0 0 0 2px #fff8,0 0 30px #000a}
#screen{width:100%;height:46%;background:#c9d7c4;border:3px solid #6d6f72;border-radius:8px;overflow:hidden;display:flex;flex-direction:column;color:#12170f;font-size:clamp(11px,3.6vmin,17px);position:relative}
#bar{background:linear-gradient(#eef1ec,#b9c4b4);padding:3px 8px;font-weight:bold;display:flex;justify-content:space-between;border-bottom:1px solid #7f8a7b}
#list{flex:1;overflow:hidden}
.it{padding:5px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;justify-content:space-between}
.it.sel{background:linear-gradient(#4d8fd8,#1f5aa6);color:#fff}
#np{flex:1;padding:8px;display:none;flex-direction:column;gap:4px}
#np img{width:46%;aspect-ratio:1;object-fit:cover;align-self:center;background:#9aa896;image-rendering:auto}
#np b,#np span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.prog{height:8px;border:1px solid #3b4a37;background:#e7efe3;border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(#4d8fd8,#1f5aa6)}
#msg{padding:10px;line-height:1.4;overflow:auto;user-select:text}
#msg input{width:100%;font-size:13px;margin:6px 0;padding:4px}
#boot{position:absolute;inset:0;background:#c9d7c4;display:flex;align-items:center;justify-content:center;font-size:7vmin;font-style:italic;transition:opacity .6s}
#wheel{width:78%;aspect-ratio:1;border-radius:50%;background:radial-gradient(#fff,#d9d9db);position:relative;touch-action:none;box-shadow:inset 0 0 0 1px #0002,0 1px 3px #0003}
#ok{position:absolute;inset:32%;border-radius:50%;background:linear-gradient(#f2f2f2,#c4c4c6);box-shadow:inset 0 0 0 1px #0002}
.lb{position:absolute;color:#7a7a7c;font-weight:bold;font-size:3.6vmin;pointer-events:none}
</style>
</head>
<body>
<div id="ipod">
  <div id="screen">
    <div id="bar"><span id="ttl">miPod</span><span id="bat">&#9654;</span></div>
    <div id="list"></div>
    <div id="np"><b id="tn"></b><span id="ta"></span><img id="ca" alt=""><div class="prog"><i id="pb"></i></div><div class="prog" style="height:5px"><i id="vb" style="background:#5c6b58"></i></div></div>
    <div id="msg" style="display:none"></div>
    <div id="boot">miPod</div>
  </div>
  <div id="wheel">
    <span class="lb" style="top:7%;left:50%;transform:translateX(-50%)">MENU</span>
    <span class="lb" style="top:50%;right:8%;transform:translateY(-50%)">&#9654;&#9654;</span>
    <span class="lb" style="top:50%;left:8%;transform:translateY(-50%)">&#9664;&#9664;</span>
    <span class="lb" style="bottom:7%;left:50%;transform:translateX(-50%)">&#9654;&#10074;&#10074;</span>
    <div id="ok"></div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const SC='user-read-private user-library-read playlist-read-private streaming user-modify-playback-state user-read-playback-state';
const REDIR=location.origin+location.pathname;
const LS=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){return null}};
let stack=[],view=null,player=null,devId=null,state=null,vol=0.6;

/* ---------- auth (PKCE, sin servidor) ---------- */
const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
async function login(){
  const cid=LS('cid'); const v=b64(crypto.getRandomValues(new Uint8Array(48)));
  LS('ver',v);
  const ch=b64(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));
  location.href='https://accounts.spotify.com/authorize?'+new URLSearchParams({client_id:cid,response_type:'code',redirect_uri:REDIR,scope:SC,code_challenge_method:'S256',code_challenge:ch});
}
async function tok(body){
  const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:LS('cid'),...body})});
  const j=await r.json(); if(!j.access_token)throw new Error(j.error_description||'auth');
  LS('at',j.access_token);LS('exp',Date.now()+j.expires_in*1000-60000);if(j.refresh_token)LS('rt',j.refresh_token);
}
async function token(){
  if(Date.now()<+LS('exp'))return LS('at');
  await tok({grant_type:'refresh_token',refresh_token:LS('rt')});return LS('at');
}
async function api(p,o={}){
  const r=await fetch('https://api.spotify.com/v1'+p,{...o,headers:{Authorization:'Bearer '+await token(),'Content-Type':'application/json'}});
  if(r.status==204||r.status==202)return {};
  return r.json();
}

/* ---------- pantallas ---------- */
function show(v,push=true){
  if(push&&view)stack.push(view);view=v;draw();
}
function back(){if(stack.length){view=stack.pop();draw()}}
function draw(){
  $('ttl').textContent=view.title;
  const L=$('list'),M=$('msg'),N=$('np');
  L.style.display=M.style.display=N.style.display='none';
  if(view.type=='np'){N.style.display='flex';renderNP();return}
  if(view.type=='msg'){M.style.display='block';M.innerHTML=view.html;return}
  L.style.display='block';
  const rows=Math.max(4,Math.floor(L.clientHeight/28)),s=view.sel||0;
  view.top=Math.min(Math.max(view.top||0,s-rows+1),s);
  L.innerHTML=view.items.slice(view.top,view.top+rows).map((it,i)=>`<div class="it${i+view.top==s?' sel':''}"><span>${esc(it.label)}</span><span>${it.sub?'&#9654;':''}</span></div>`).join('')||'<div class="it">Vacío</div>';
}
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function renderNP(){
  const t=state&&state.track_window&&state.track_window.current_track;
  if(!t){$('tn').textContent='Nada sonando';$('ta').textContent='Elige algo del menú';$('ca').style.visibility='hidden';return}
  $('tn').textContent=t.name;$('ta').textContent=t.artists.map(a=>a.name).join(', ');
  const im=t.album.images[t.album.images.length-1];$('ca').style.visibility='visible';if(im&&$('ca').src!=im.url)$('ca').src=im.url;
  $('pb').style.width=(state.position/state.duration*100)+'%';$('vb').style.width=(vol*100)+'%';
  $('bat').innerHTML=state.paused?'&#10074;&#10074;':'&#9654;';
}
setInterval(()=>{if(state&&!state.paused){state.position=Math.min(state.duration,state.position+500);if(view&&view.type=='np')renderNP()}},500);

function scroll(d){
  if(!view)return;
  if(view.type=='np'){vol=Math.min(1,Math.max(0,vol+d*0.04));player&&player.setVolume(vol);renderNP();return}
  if(!view.items)return;
  view.sel=Math.min(view.items.length-1,Math.max(0,(view.sel||0)+d));draw();
}
function select(){
  if(!view)return;
  if(view.type=='np'){player&&player.togglePlay();return}
  const it=view.items&&view.items[view.sel||0];it&&it.go&&it.go();
}

/* ---------- datos ---------- */
function playUris(uris,i=0){
  if(!devId)return msg('Conectando…','El reproductor aún no está listo. Espera unos segundos.');
  api('/me/player/play?device_id='+devId,{method:'PUT',body:JSON.stringify({uris:uris.slice(i,i+50)})}).then(()=>show({type:'np',title:'Sonando'}));
}
function playCtx(uri){
  if(!devId)return msg('Conectando…','El reproductor aún no está listo.');
  api('/me/player/play?device_id='+devId,{method:'PUT',body:JSON.stringify({context_uri:uri})}).then(()=>show({type:'np',title:'Sonando'}));
}
function trackList(title,tracks){
  const uris=tracks.map(t=>t.uri);
  show({title,items:tracks.map((t,i)=>({label:t.name+' – '+t.artists[0].name,go:()=>playUris(uris,i)})),sel:0});
}
async function liked(){
  msg('Cargando…','');const j=await api('/me/tracks?limit=50');
  stack.pop();trackList('Canciones',j.items.map(x=>x.track).filter(Boolean));
}
async function playlists(){
  msg('Cargando…','');const j=await api('/me/playlists?limit=50');stack.pop();
  show({title:'Playlists',sel:0,items:(j.items||[]).filter(Boolean).map(p=>({label:p.name,sub:1,go:()=>playCtx(p.uri)}))});
}
async function search(){
  const q=prompt('Buscar canción o artista');if(!q)return;
  msg('Buscando…','');const j=await api('/search?type=track&limit=30&q='+encodeURIComponent(q));
  stack.pop();trackList('Resultados',j.tracks.items);
}
function msg(t,h){show({type:'msg',title:t,html:h})}
function mainMenu(){
  stack=[];view=null;
  show({title:'miPod',sel:0,items:[
    {label:'Sonando ahora',sub:1,go:()=>show({type:'np',title:'Sonando'})},
    {label:'Playlists',sub:1,go:playlists},
    {label:'Canciones guardadas',sub:1,go:liked},
    {label:'Buscar',sub:1,go:search},
    {label:'Ajustes',sub:1,go:settings}
  ]},false);
}
function settings(){
  show({title:'Ajustes',sel:0,items:[
    {label:'Cerrar sesión',go:()=>{['at','rt','exp'].forEach(k=>LS(k,null));location.href=REDIR}},
    {label:'Cambiar Client ID',go:()=>{LS('cid',null);location.href=REDIR}}
  ]});
}

/* ---------- reproductor ---------- */
function startPlayer(){
  window.onSpotifyWebPlaybackSDKReady=()=>{
    player=new Spotify.Player({name:'miPod',getOAuthToken:cb=>token().then(cb),volume:vol});
    player.addListener('ready',e=>{devId=e.device_id});
    player.addListener('player_state_changed',s=>{state=s;if(view&&view.type=='np')renderNP()});
    player.addListener('initialization_error',e=>msg('Error',esc(e.message)+'<br>Este navegador quizá no soporta audio protegido. Prueba Chrome o Firefox actualizado.'));
    player.addListener('authentication_error',e=>msg('Error de sesión',esc(e.message)));
    player.addListener('account_error',()=>msg('Cuenta','Spotify Web Playback requiere Premium.'));
    player.connect();
  };
  const s=document.createElement('script');s.src='https://sdk.scdn.co/spotify-player.js';document.body.appendChild(s);
}

/* ---------- rueda ---------- */
const W=$('wheel');let last=null,acc=0,moved=0,sx,sy;
const ang=e=>{const r=W.getBoundingClientRect();return Math.atan2(e.clientY-r.top-r.height/2,e.clientX-r.left-r.width/2)*180/Math.PI};
W.addEventListener('pointerdown',e=>{W.setPointerCapture(e.pointerId);last=ang(e);acc=0;moved=0;sx=e.clientX;sy=e.clientY});
W.addEventListener('pointermove',e=>{
  if(last===null)return;let a=ang(e),d=a-last;if(d>180)d-=360;if(d<-180)d+=360;last=a;acc+=d;moved+=Math.abs(d);
  while(acc>=22){acc-=22;scroll(1)}while(acc<=-22){acc+=22;scroll(-1)}
});
W.addEventListener('pointerup',e=>{
  if(last===null)return;last=null;if(moved>12)return;
  const r=W.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,d=Math.hypot(dx,dy)/(r.width/2);
  if(d<0.36)return select();
  if(Math.abs(dy)>Math.abs(dx)){dy<0?back():player&&player.togglePlay()}
  else dx>0?player&&player.nextTrack():player&&player.previousTrack();
});
addEventListener('keydown',e=>{
  if(['INPUT'].includes(e.target.tagName))return;
  if(e.key=='ArrowDown')scroll(1);if(e.key=='ArrowUp')scroll(-1);
  if(e.key=='Enter')select();if(e.key=='Escape'||e.key=='Backspace')back();
  if(e.key==' ')player&&player.togglePlay();
});

/* ---------- arranque ---------- */
async function boot(){
  const q=new URLSearchParams(location.search);
  try{
    if(q.get('code')){
      await tok({grant_type:'authorization_code',code:q.get('code'),redirect_uri:REDIR,code_verifier:LS('ver')});
      history.replaceState(null,'',REDIR);
    }
  }catch(e){history.replaceState(null,'',REDIR)}
  setTimeout(()=>{$('boot').style.opacity=0;setTimeout(()=>$('boot').remove(),600)},1200);
  if(LS('rt')){mainMenu();startPlayer();return}
  if(!LS('cid')){
    msg('Configurar',`Pega tu Client ID de Spotify.<br>Redirect URI:<br><b style="font-size:10px;word-break:break-all">${esc(REDIR)}</b><input id="ci" placeholder="Client ID"><button id="go">Guardar</button>`);
    $('go').onclick=()=>{const v=$('ci').value.trim();if(v){LS('cid',v);location.reload()}};
    return;
  }
  msg('Spotify','Toca el botón central para conectar tu cuenta.');
  view.items=[];view.type='msg';
  $('ok').onclick=()=>{if(!LS('rt'))login()};
}
boot();
</script>
</body>
</html>
